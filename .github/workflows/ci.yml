name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: greer
          POSTGRES_PASSWORD: greer
          POSTGRES_DB: greer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greer" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: greer
          POSTGRES_PASSWORD: greer
          POSTGRES_DB: greer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greer" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  self-host:
    name: Docker image + self-host smoke test
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      BETTER_AUTH_SECRET: ci-secret-not-for-production-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - name: Health reports database and worker ok
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS http://localhost:3000/api/health || true)
            echo "$body"
            echo "$body" | grep -q '"status":"ok"' && exit 0
            sleep 2
          done
          exit 1
      - name: Image size
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep greer
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
