# Local development: `docker compose up -d postgres`.
# The web and worker services are added in Milestone 1, step 4 (self-hosting).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greer
      POSTGRES_PASSWORD: greer
      POSTGRES_DB: greer
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greer -d greer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
