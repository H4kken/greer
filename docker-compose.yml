# Self-hosting Greer: Postgres + web + worker. Works with Coolify or plain
# `docker compose up -d --build`. Required variables are listed in README.md.
# (Local development uses docker-compose.dev.yml.)

x-app-env: &app-env
  DATABASE_URL: postgres://greer:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/greer
  # Also decrypts the keys saved in Settings, so the worker needs it too.
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
  # AI: a TypeSafe key (scoring, recommended) and/or one LLM provider here,
  # or save keys in Settings instead.
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
  LLM_QUALITY_MODEL: ${LLM_QUALITY_MODEL:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: greer
    # Not published: only the web and worker containers can reach the database.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greer -d greer"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Healthcheck (GET /api/health) is defined in the Dockerfile.

  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    environment:
      <<: *app-env
    depends_on:
      # The web container applies migrations before it reports healthy.
      web:
        condition: service_healthy
    healthcheck:
      # No HTTP server: healthy while the heartbeat job keeps touching this
      # file (every minute). Its liveness also shows up in /api/health.
      test:
        ["CMD-SHELL", "find /tmp/greer-worker-heartbeat -mmin -3 | grep -q ."]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres-data:
